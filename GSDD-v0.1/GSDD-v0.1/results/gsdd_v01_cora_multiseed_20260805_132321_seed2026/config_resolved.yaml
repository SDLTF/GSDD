experiment:
  name: gsdd_v01_cora_multiseed
  seed: 2026
  output_root: results
  device: auto
dataset:
  name: Cora
  root: data
  normalize_features: true
  synthetic_nodes: 240
  synthetic_features: 48
  synthetic_classes: 3
attack:
  enabled: true
  target_class: 0
  selection_method: dirty_label
  poison_count: 20
  trigger_size: 3
  trigger_feature_count: 40
  trigger_feature_value: 1.0
  stamp_victim_features: true
  test_victim_count: 100
model:
  hidden_dim: 128
  dropout: 0.5
  supervised_epochs: 300
  ssl_epochs: 300
  learning_rate: 0.01
  weight_decay: 0.0005
  patience: 60
spectral:
  num_bands: 4
  moment_orders:
  - 2
  - 3
  - 4
  - 5
  hutchinson_probes: 48
  epsilon: 1.0e-08
  layers:
  - 1
  - 2
detection:
  degree_bins: 3
  minimum_group_size: 8
  mad_epsilon: 1.0e-06
  topk_fraction: 0.15
  score_clip: 10.0
output:
  save_models: true
  make_plots: true
  verbose: true
