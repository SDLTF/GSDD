experiment:
  name: gsdd_v064_dual_cl
  seed: 1027
  output_root: results
  device: cuda

dataset:
  name: Cora
  root: data
  normalize_features: true

attack:
  enabled: true
  family: dpgba_style_binding_aware
  target_class: 5
  selection_method: clean_label
  ablation_mode: full
  poison_count: 12
  trigger_size: 3
  trigger_feature_count: 40
  trigger_feature_value: 1.0
  stamp_victim_features: false
  test_victim_count: 100

  surrogate_hidden_dim: 96
  surrogate_epochs: 240
  surrogate_patience: 55
  generator_hidden_dim: 192
  generator_epochs: 300
  generator_learning_rate: 0.006
  generator_patience: 70
  generator_topk_features: 40
  generator_prototype_count: 36
  homophily_weight: 0.20
  distribution_weight: 0.25
  sparsity_weight: 0.003
  topology_density_weight: 0.025
  victim_stamp_strength: 0.0

  generator_outer_rounds: 5
  generator_calibration_count: 64
  poison_target_weight: 4.0
  binding_gap_weight: 8.0
  binding_margin: 1.2
  clean_preserve_weight: 3.0
  clean_evasion_weight: 8.0
  clean_preserve_margin: 0.5
  adaptive_raw_blend: 0.75
  distribution_raw_blend: 0.72
  distribution_target_prototype_fraction: 0.50

  clean_label_baseline_asr_max: 0.10
  clean_label_clean_trigger_asr_max: 0.20
  clean_label_poison_no_trigger_asr_max: 0.20
  clean_label_shuffled_asr_max: 0.20
  clean_label_full_asr_min: 0.80
  clean_label_binding_gap_min: 0.40
  clean_label_target_scan_max: 0.15
  clean_label_max_targets: 1
  clean_label_shuffle_shift: 1

  clean_label_attack_mode: generic
  generic_clean_trigger_asr_max: 0.20
  generic_poison_no_trigger_asr_max: 0.20
  generic_full_asr_min: 0.80
  generic_did_min: 0.40
  generic_shuffled_target_weight: 3.0
  generic_consistency_weight: 0.30
  contextual_pair_weight: 6.0
  contextual_pair_margin: 0.15
  contextual_relation_weight: 0.75
  contextual_diversity_weight: 0.20
  contextual_min_feature_std: 0.002

model:
  hidden_dim: 128
  dropout: 0.5
  supervised_epochs: 340
  ssl_epochs: 0
  learning_rate: 0.01
  weight_decay: 0.0005
  patience: 75

spectral:
  num_bands: 4
  moment_orders: [2, 3, 4, 5]
  hutchinson_probes: 0
  epsilon: 1.0e-8
  layers: [1, 2]

detection:
  degree_bins: 3
  global_degree_bins: 1
  minimum_group_size: 4
  mad_epsilon: 1.0e-6
  topk_fraction: 0.05
  score_clip: 10.0
  trim_fraction: 0.20
  trim_minimum_keep: 4
  raw_feature_topk: 30

paired:
  training_seed_offset: 10000
  repeat_full_control: false
  permutation_repeats: 5000

reproducibility:
  enabled: true
  deterministic_algorithms: true
  warn_only: true
  allow_tf32: false
  matmul_precision: highest
  cublas_workspace_config: ":4096:8"
  replicas: 1

output:
  save_models: false
  make_plots: true
  verbose: true
