experiment:
  name: gsdd_v062_repair2_dpgba
  seed: 1027
  output_root: results
  device: cuda

dataset:
  name: Cora
  root: data
  normalize_features: true

attack:
  enabled: true
  family: dpgba_style_binding_aware
  target_class: 0
  selection_method: clean_label
  ablation_mode: full
  poison_count: 12
  trigger_size: 3
  trigger_feature_count: 40
  trigger_feature_value: 1.0
  stamp_victim_features: false
  test_victim_count: 100

  surrogate_hidden_dim: 96
  surrogate_epochs: 220
  surrogate_patience: 50
  generator_hidden_dim: 160
  generator_epochs: 240
  generator_learning_rate: 0.008
  generator_patience: 55
  generator_topk_features: 32
  generator_prototype_count: 32
  homophily_weight: 0.25
  distribution_weight: 0.35
  sparsity_weight: 0.005
  topology_density_weight: 0.03
  victim_stamp_strength: 0.0

  generator_outer_rounds: 4
  generator_calibration_count: 48
  poison_target_weight: 2.5
  binding_gap_weight: 6.0
  binding_margin: 1.0
  clean_preserve_weight: 4.0
  clean_evasion_weight: 8.0
  clean_preserve_margin: 0.5
  adaptive_raw_blend: 0.75
  distribution_raw_blend: 0.60
  distribution_target_prototype_fraction: 0.40

  validity_full_asr_min: 0.80
  validity_control_asr_max: 0.10
  validity_binding_gap_min: 0.60

model:
  hidden_dim: 128
  dropout: 0.5
  supervised_epochs: 320
  ssl_epochs: 0
  learning_rate: 0.01
  weight_decay: 0.0005
  patience: 70

spectral:
  num_bands: 4
  moment_orders: [2, 3, 4, 5]
  hutchinson_probes: 0
  epsilon: 1.0e-8
  layers: [1, 2]

detection:
  degree_bins: 3
  global_degree_bins: 1
  minimum_group_size: 8
  mad_epsilon: 1.0e-6
  topk_fraction: 0.05
  score_clip: 10.0
  trim_fraction: 0.20
  trim_minimum_keep: 6
  raw_feature_topk: 30

paired:
  training_seed_offset: 10000
  repeat_full_control: false
  permutation_repeats: 5000

reproducibility:
  enabled: true
  deterministic_algorithms: true
  warn_only: true
  allow_tf32: false
  matmul_precision: highest
  cublas_workspace_config: ":4096:8"
  replicas: 1

output:
  save_models: false
  make_plots: true
  verbose: true
